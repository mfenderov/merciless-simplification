name: release

# Issue a new version whenever the methodology, skill, or extension changes:
# bump patch version, tag vX.Y.Z, push the tag, publish to npm.
# Guarded so the release commit itself does not re-trigger the workflow.

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "skills/**"
      - "content/_index.md"
      - "package.json"

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.head_commit.author.name != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump patch version
        id: bump
        run: npm version patch --no-git-tag-version

      - name: Commit, tag, and push release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping npm publish (tag created anyway)"
            exit 0
          fi
          npm publish --access public
